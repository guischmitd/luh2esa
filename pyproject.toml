[project]
name = "recover"
version = "0.1.0"
description = "Models and utility functions to re-cover compositional land cover data from LUH2"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "geopandas>=1.2.0",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.10.9",
    "nbformat>=5.10.4",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "rasterio>=1.4.4",
    "scikit-learn>=1.9.0",
    "shapely>=2.2.0",
    "statsmodels>=0.14.6",
    "torch>=2.12.0",
    "tqdm>=4.68.2",
]

[tool.uv]
package = true
